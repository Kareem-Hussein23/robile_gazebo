controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    robile_hub_wheels_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

robile_hub_wheels_controller:
  ros__parameters:
    joints:
      - robile_5_drive_left_hub_wheel_joint
      - robile_5_drive_right_hub_wheel_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity
      - position
